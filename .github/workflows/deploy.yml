name: CD - Deploy to Production

on:
  workflow_run:
    workflows: ["CI Pipeline"] # Chạy sau khi CI (ci.yml) thành công
    types: [completed]
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Deploy to App Server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.APP_SERVER_1_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd ~/final-project
            # Gỡ bỏ container cũ đang bị lỗi kẹt (nếu có)
            sudo docker rm -f midterm_web || true
            
            # Cập nhật code mới nhất
            git pull origin main
            
            # Sử dụng 'docker compose' (V2) thay vì 'docker-compose' (V1)
            # Lệnh này sạch hơn và không bị lỗi KeyError
            sudo docker compose down
            sudo docker compose up -d --build