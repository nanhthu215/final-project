name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  # Giải quyết cảnh báo deprecation của GitHub Actions (Node.js 20 -> 24)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ci:
    name: CI - Build, Lint, Scan, Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/package-lock.json

      - name: Install dependencies
        run: cd src && npm install

      - name: Lint code
        run: cd src && npm run lint

      - name: Test
        run: cd src && npm test

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/midterm-app:${{ github.sha }} .
          docker tag ${{ secrets.DOCKER_USERNAME }}/midterm-app:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/midterm-app:latest

      - name: Security scan - Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKER_USERNAME }}/midterm-app:${{ github.sha }}'
          exit-code: '1'        # Pipeline dừng nếu có lỗ hổng CRITICAL hoặc HIGH
          severity: 'CRITICAL,HIGH'
          format: 'table'
          ignore-unfixed: true  # Bỏ qua CVE chưa có bản vá (tránh kẹt pipeline do base image)
          trivyignores: .trivyignore

      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push image to Docker Hub
        if: github.ref == 'refs/heads/main'
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/midterm-app:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/midterm-app:latest
          echo "Pushed: ${{ secrets.DOCKER_USERNAME }}/midterm-app:${{ github.sha }}"

  # ─── BONUS 7.2: Multi-Environment ───────────────────────────────────────────
  deploy-staging:
    name: CD - Deploy to Staging
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: staging  # GitHub Environment (không cần approval)

    steps:
      - name: Deploy to Staging environment (port 3100)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.APP_SERVER_1_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            IMAGE="${{ secrets.DOCKER_USERNAME }}/midterm-app:${{ github.sha }}"
            docker pull "$IMAGE"

            # Tạo mới hoặc cập nhật staging service (standalone, cổng 3100)
            if docker service ls --format '{{.Name}}' | grep -q '^staging_web$'; then
              docker service update \
                --image "$IMAGE" \
                --update-parallelism 1 \
                --update-delay 10s \
                staging_web
            else
              docker service create \
                --name staging_web \
                --replicas 1 \
                --publish published=3100,target=3000 \
                --env MONGO_URI=mongodb://172.31.33.108:27017/final_project \
                "$IMAGE"
            fi

            sleep 15
            curl -f http://localhost:3100/health || exit 1
            echo "Staging deployed OK: ${{ github.sha }}"

  # ─── BONUS 7.2 + 7.4: Production với Approval Gate + Auto Rollback ──────────
  deploy-production:
    name: CD - Deploy to Production (Approval Required)
    needs: deploy-staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production  # GitHub Environment (yêu cầu approval thủ công)

    steps:
      - name: Rolling Update with Auto Rollback on Failure
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.APP_SERVER_1_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            IMAGE="${{ secrets.DOCKER_USERNAME }}/midterm-app:${{ github.sha }}"
            docker pull "$IMAGE"

            # Rolling Update: 1 replica mỗi lần, đợi 10s → Zero Downtime
            docker service update \
              --image "$IMAGE" \
              --update-parallelism 1 \
              --update-delay 10s \
              myapp_web

            sleep 20
            docker service ps myapp_web

            # BONUS 7.4: Auto Rollback nếu health check thất bại sau deploy
            if ! curl -sf http://localhost:3000/health > /dev/null; then
              echo "Health check FAILED! Initiating automatic rollback..."
              docker service rollback myapp_web
              sleep 15
              docker service ps myapp_web
              curl -sf http://localhost:3000/health \
                && echo "Rollback successful — previous stable version restored." \
                || echo "Warning: rollback health check also failed."
              exit 1
            fi

            echo "Production deployed successfully: ${{ github.sha }}"

      - name: Health Check on Worker Node
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.APP_SERVER_2_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "Verifying service status on Worker Node..."
            docker ps | grep myapp_web || echo "Service not yet balanced to this node (normal for small clusters)"
            curl -f http://localhost:3000/health || exit 1
            echo "Worker Node is healthy."