name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci:
    name: CI - Build, Lint, Scan, Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/package-lock.json

      - name: Install dependencies
        run: cd src && npm install

      - name: Lint code
        run: cd src && npm run lint

      - name: Test
        run: cd src && npm test

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/midterm-app:${{ github.sha }} .
          docker tag ${{ secrets.DOCKER_USERNAME }}/midterm-app:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/midterm-app:latest

      - name: Security scan - Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKER_USERNAME }}/midterm-app:${{ github.sha }}'
          exit-code: '1' # Pipeline sẽ dừng nếu có lỗ hổng CRITICAL hoặc HIGH
          severity: 'CRITICAL,HIGH'
          format: 'table'
          ignore-unfixed: true # Bỏ qua nếu lỗ hổng chưa có bản vá (tránh kẹt pipeline do base image)
          trivyignores: .trivyignore # Hỗ trợ bỏ qua các CVE cụ thể nếu cần

      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push image to Docker Hub
        if: github.ref == 'refs/heads/main'
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/midterm-app:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/midterm-app:latest
          echo "Pushed: ${{ secrets.DOCKER_USERNAME }}/midterm-app:${{ github.sha }}"

  deploy:
    name: CD - Deploy to Swarm
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to Swarm
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.APP_SERVER_1_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            docker pull ${{ secrets.DOCKER_USERNAME }}/midterm-app:${{ github.sha }}
            docker service update \
              --image ${{ secrets.DOCKER_USERNAME }}/midterm-app:${{ github.sha }} \
              --update-parallelism 1 \
              --update-delay 10s \
              myapp_web
            sleep 20
            docker service ps myapp_web
            curl -f http://localhost:3000/health || exit 1
            echo "Swarm rolling update deployed: ${{ github.sha }}"

      - name: Health Check on Worker Node
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.APP_SERVER_2_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "Verifying service status on Worker Node..."
            # Kiểm tra xem container có đang chạy trên node này không
            docker ps | grep myapp_web || echo "Service not yet balanced to this node (normal for small clusters)"
            # Kiểm tra khả năng truy cập dịch vụ từ node này
            curl -f http://localhost:3000/health || exit 1
            echo "Worker Node is healthy."