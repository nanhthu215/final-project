name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci:
    name: CI - Build, Lint, Scan, Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/package-lock.json

      - name: Install dependencies
        run: cd src && npm install

      - name: Lint code
        run: cd src && npm run lint

      - name: Test
        run: cd src && npm test

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/midterm-app:${{ github.sha }} .
          docker tag ${{ secrets.DOCKER_USERNAME }}/midterm-app:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/midterm-app:latest

      - name: Security scan - Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKER_USERNAME }}/midterm-app:${{ github.sha }}'
          exit-code: '0' # Đổi từ 1 sang 0 để Pipeline không bị ngắt
          severity: 'CRITICAL,HIGH'
          format: 'table'
        # continue-on-error: true # Có dòng này cũng được, nhưng exit-code 0 là đủ để xanh rồi

      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push image to Docker Hub
        if: github.ref == 'refs/heads/main'
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/midterm-app:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/midterm-app:latest
          echo "Pushed: ${{ secrets.DOCKER_USERNAME }}/midterm-app:${{ github.sha }}"

  deploy:
    name: CD - Deploy to Swarm
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to Swarm
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.APP_SERVER_1_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            docker pull ${{ secrets.DOCKER_USERNAME }}/midterm-app:${{ github.sha }}
            docker service update \
              --image ${{ secrets.DOCKER_USERNAME }}/midterm-app:${{ github.sha }} \
              --update-parallelism 1 \
              --update-delay 10s \
              myapp_web
            sleep 20
            docker service ps myapp_web
            curl -f http://localhost:3000/health || exit 1
            echo "Swarm rolling update deployed: ${{ github.sha }}"