---
- name: Setup App Servers
  hosts: app_servers
  become: yes
  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install Docker and tools
      apt:
        name:
          - docker.io
          - docker-compose
          - nginx
          - certbot
          - python3-certbot-nginx
          - curl
          - git
        state: present

    - name: Start and enable Docker
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Start and enable Nginx
      systemd:
        name: nginx
        state: started
        enabled: yes

    - name: Create Nginx configuration for Reverse Proxy
      copy:
        dest: /etc/nginx/sites-available/default
        content: |
          server {
              listen 80;
              server_name finalprojectdeloy.duckdns.org;
              location / {
                  proxy_pass http://localhost:3000;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection 'upgrade';
                  proxy_set_header Host $host;
                  proxy_cache_bypass $http_upgrade;
              }
          }
      notify: Restart Nginx

    - name: Add ubuntu to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes

    - name: Create app directory
      file:
        path: /home/ubuntu/myapp
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Create DuckDNS update script
      copy:
        dest: /home/ubuntu/update-duckdns.sh
        content: |
          #!/bin/bash
          # Doi 30s cho mang on dinh roi moi cap nhat IP
          sleep 30
          curl -s "https://www.duckdns.org/update?domains=finalprojectdeloy&token={{ duckdns_token }}&ip="
        mode: '0755'

    - name: Add DuckDNS update to crontab @reboot
      cron:
        name: "Update DuckDNS on reboot"
        special_time: reboot
        job: "/bin/bash /home/ubuntu/update-duckdns.sh"

- name: Setup DB Server
  hosts: db_servers
  become: yes
  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install Docker
      apt:
        name:
          - docker.io
          - docker-compose
          - curl
        state: present

    - name: Start and enable Docker
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Add ubuntu to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes

    - name: Create db directory
      file:
        path: /home/ubuntu/db
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Create monitoring directory
      file:
        path: /home/ubuntu/monitoring
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Write prometheus.yml
      copy:
        dest: /home/ubuntu/monitoring/prometheus.yml
        content: |
          global:
            scrape_interval: 15s

          scrape_configs:
            - job_name: 'prometheus'
              static_configs:
                - targets: ['localhost:9090']

            - job_name: 'node-exporter-db'
              static_configs:
                - targets: ['172.31.33.108:9100']
                  labels:
                    server: 'db-server'

            - job_name: 'app-server-1'
              static_configs:
                - targets: ['172.31.36.207:9100']
                  labels:
                    server: 'app-server-1'

            - job_name: 'app-server-2'
              static_configs:
                - targets: ['172.31.35.211:9100']
                  labels:
                    server: 'app-server-2'

            - job_name: 'cadvisor-1'
              static_configs:
                - targets: ['172.31.36.207:8080']

            - job_name: 'cadvisor-2'
              static_configs:
                - targets: ['172.31.35.211:8080']
        owner: ubuntu
        group: ubuntu
        mode: '0644'

    - name: Restart Prometheus
      shell: docker restart prometheus
      changed_when: false

  handlers:
    - name: Restart Nginx
      service:
        name: nginx
        state: restarted