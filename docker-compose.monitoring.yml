# docker-compose.monitoring.yml
# Chạy trên DB Server (172.31.33.108) — độc lập, không thuộc Swarm cluster
#
# Khởi động:  docker compose -f docker-compose.monitoring.yml up -d
# Dừng:       docker compose -f docker-compose.monitoring.yml down

version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      # File này được Ansible sinh tự động (ansible/playbook.yml)
      # hoặc được restart_swarm.sh tái tạo khi IP thay đổi
      - /home/ubuntu/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped
    depends_on:
      - prometheus

volumes:
  grafana_data:
